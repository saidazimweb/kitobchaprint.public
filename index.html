<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KitobchaPrint v2 - Qulay Chop Etish</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-icon { font-size: 26px; background: #eff6ff; padding: 6px 10px; border-radius: 8px; }
    .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-accent { background: #059669; color: #fff; }
    .btn-secondary { background: #f1f5f9; border-color: #cbd5e1; }
    .btn-outline { background: transparent; border-color: #cbd5e1; }
    .btn-sm { padding: 5px 10px; font-size: 11px; }
    .btn-full { width: 100%; }

    .upload-box { display: flex; align-items: center; justify-content: center; height: 75vh; }
    .drop-zone { background: #fff; border: 2px dashed #93c5fd; border-radius: 12px; padding: 60px 40px; text-align: center; max-width: 500px; width: 100%; cursor: pointer; }
    .drop-zone:hover { border-color: #2563eb; background: #eff6ff; }
    .drop-icon { font-size: 50px; margin-bottom: 12px; }

    .workspace { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - var(--hh, 65px)); }
    .sidebar { background: #fff; border-right: 1px solid #e2e8f0; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .panel-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; }
    .panel-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; color: #334155; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .chk { font-size: 12px; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .nup-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .nup-btn { padding: 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; font-weight: bold; cursor: pointer; }
